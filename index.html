<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Music Organizer</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color-scheme:dark}body{max-width:820px;margin:35px auto;padding:0 18px;background:#121212;color:#f5f5f5;line-height:1.5}h1{font-size:1.7rem}button,input{font:inherit;padding:11px;border-radius:7px}input{background:#242424;color:white;border:1px solid #666;max-width:100%;width:360px}button{background:#1ed760;color:#111;border:0;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5;cursor:wait}.secondary{background:#303030;color:white}section{background:#1d1d1d;border-radius:12px;padding:20px;margin:18px 0}small,.muted{color:#bbb}#status{white-space:pre-wrap;overflow-wrap:anywhere}ul{padding-left:23px}li{margin:5px 0}code{overflow-wrap:anywhere}a{color:#8be9ad}
</style>
</head>
<body>
<h1>Spotify Music Organizer</h1>
<p>Spotify arşivini incele. Bu sürüm <strong>salt okunur</strong>: hiçbir çalma listesini veya şarkıyı değiştirmez.</p>
<section id="loginBox">
<label for="cid">Spotify Client ID</label><br>
<input id="cid" autocomplete="off" spellcheck="false" placeholder="Spotify Developer Dashboard'daki Client ID">
<br><button id="login">Spotify ile güvenli bağlan</button>
<p class="muted"><small>Client Secret, şifre veya erişim kodunu buraya yazma. Client ID yalnızca bu tarayıcıda tutulur.</small></p>
</section>
<section id="results" hidden>
<p id="profile"></p>
<button id="scan">Kütüphaneyi tara</button>
<button id="json" class="secondary" disabled>JSON indir</button>
<button id="csv" class="secondary" disabled>Şarkı CSV indir</button>
<button id="logout" class="secondary">Oturumu kapat</button>
<p id="counts"></p>
<div id="lists"></div>
</section>
<section><strong>Durum</strong><p id="status" role="status">Bağlantı bekleniyor.</p></section>
<script>
'use strict';
const redirect = 'https://theoalp91.github.io/spotify-music-organizer/';
const scopes = 'playlist-read-private playlist-read-collaborative user-library-read playlist-modify-public playlist-modify-private';
const $ = id => document.getElementById(id);
const status = message => { $('status').textContent = message; };
const encoder = new TextEncoder();
const base64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const random = count => base64url(crypto.getRandomValues(new Uint8Array(count)));
async function challenge(verifier){return base64url(new Uint8Array(await crypto.subtle.digest('SHA-256',encoder.encode(verifier))));}
let token = null, archive = null;
const pending = key => sessionStorage.getItem('spotify_org_'+key);
const savePending = (key,value) => sessionStorage.setItem('spotify_org_'+key,value);
const clearPending = () => ['verifier','state'].forEach(k=>sessionStorage.removeItem('spotify_org_'+k));
const showSignedIn = () => { $('loginBox').hidden=true; $('results').hidden=false; };
function cleanUrl(){history.replaceState(null,'',redirect);}
async function authorize(){
  const cid=$('cid').value.trim();
  if(!/^[a-zA-Z0-9]{20,}$/.test(cid)){status('Geçerli Spotify Client ID gir.');return;}
  if(!crypto.subtle){status('Bu uygulama HTTPS üzerinden açılmalıdır.');return;}
  const verifier=random(64), state=random(24);
  savePending('verifier',verifier);savePending('state',state);savePending('cid',cid);
  const params=new URLSearchParams({response_type:'code',client_id:cid,redirect_uri:redirect,scope:scopes,code_challenge_method:'S256',code_challenge:await challenge(verifier),state});
  location.assign('https://accounts.spotify.com/authorize?'+params.toString());
}
async function finishLogin(){
  const params=new URLSearchParams(location.search);
  if(!params.has('code') && !params.has('error'))return;
  const code=params.get('code'), state=params.get('state');
  cleanUrl();
  if(params.has('error')){status('Spotify izin vermedi: '+params.get('error'));clearPending();return;}
  const verifier=pending('verifier'), cid=pending('cid');
  if(!state || state!==pending('state') || !verifier || !cid){status('Giriş doğrulaması bulunamadı. Bu sayfadan yeniden bağlan.');clearPending();return;}
  clearPending();
  status('Spotify yetkilendirmesi alındı. Erişim doğrulanıyor...');
  try{
    const response=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:cid,grant_type:'authorization_code',code,redirect_uri:redirect,code_verifier:verifier})});
    const data=await response.json();
    if(!response.ok || !data.access_token)throw new Error(data.error_description || data.error || 'HTTP '+response.status);
    token=data.access_token;
    showSignedIn();
    status('Spotify bağlantısı kuruldu. “Kütüphaneyi tara” düğmesine bas.');
    try{const me=await api('https://api.spotify.com/v1/me');$('profile').textContent='Bağlı hesap: '+(me.display_name||me.id||'Spotify kullanıcısı');}catch(e){$('profile').textContent='Spotify hesabına bağlanıldı.';}
  }catch(e){status('Bağlantı tamamlanamadı: '+e.message+'\nSpotify uygulamasındaki Redirect URI tam olarak '+redirect+' olmalı.');}
}
async function api(url){
  if(!token)throw new Error('Önce Spotify hesabına bağlan.');
  for(let attempt=0;attempt<3;attempt++){
    const response=await fetch(url,{headers:{Authorization:'Bearer '+token}});
    if(response.status===429){const wait=Math.min(Number(response.headers.get('Retry-After')||'2'),30);status('Spotify hız sınırı: '+wait+' saniye bekleniyor...');await new Promise(r=>setTimeout(r,wait*1000));continue;}
    if(!response.ok){let detail='';try{detail=(await response.json()).error?.message||''}catch(_){}throw new Error('Spotify API '+response.status+(detail?': '+detail:'')+' ['+new URL(url).pathname+']');}
    return response.json();
  }
  throw new Error('Spotify hız sınırı nedeniyle işlem durduruldu. Biraz sonra yeniden dene.');
}
async function paginate(firstUrl,onPage){
  let url=firstUrl, page=0, items=[];
  while(url){
    if(++page>1000)throw new Error('Güvenlik sınırı: çok fazla sayfa.');
    const data=await api(url);
    if(!Array.isArray(data.items))throw new Error('Spotify beklenmeyen veri döndürdü.');
    items.push(...data.items);
    if(onPage)onPage(items.length,data.total);
    url=data.next;
  }
  return items;
}
function trackInfo(item,source,playlist){
  const t=item.track||item.item||item;
  if(!t || !t.id)return null;
  return {id:t.id,name:t.name||'',artists:(t.artists||[]).map(a=>a.name).join(', '),album:t.album?.name||'',duration_ms:t.duration_ms||0,explicit:!!t.explicit,added_at:item.added_at||'',source,playlist_id:playlist?.id||'',playlist_name:playlist?.name||'',spotify_url:t.external_urls?.spotify||''};
}
async function scan(){
  $('scan').disabled=true;$('json').disabled=true;$('csv').disabled=true;archive=null;
  try{
    status('Çalma listeleri okunuyor...');
    const playlists=await paginate('https://api.spotify.com/v1/me/playlists?limit=50',(n,total)=>status('Çalma listeleri: '+n+'/'+(total??'?')));
    const liked=await paginate('https://api.spotify.com/v1/me/tracks?limit=50',(n,total)=>status('Beğenilen şarkılar: '+n+'/'+(total??'?')));
    const records=liked.map(x=>trackInfo(x,'liked',null)).filter(Boolean);
    const details=[];
    for(let i=0;i<playlists.length;i++){
      const p=playlists[i];
      status('Liste '+(i+1)+'/'+playlists.length+': '+p.name);
      let entries=[];
      try{
        entries=await paginate('https://api.spotify.com/v1/playlists/'+encodeURIComponent(p.id)+'/items?limit=100');
      }catch(e){details.push({id:p.id,name:p.name,owner:p.owner?.display_name||p.owner?.id||'',owner_id:p.owner?.id||'',error:e.message,tracks:[]});continue;}
      const tracks=entries.map(x=>trackInfo(x,'playlist',p)).filter(Boolean);
      records.push(...tracks);
      details.push({id:p.id,name:p.name,description:p.description||'',owner:p.owner?.display_name||p.owner?.id||'',owner_id:p.owner?.id||'',public:p.public,tracks});
    }
    archive={exported_at:new Date().toISOString(),playlists:details,liked_tracks:records.filter(x=>x.source==='liked'),all_track_entries:records};
    const unique=new Set(records.map(x=>x.id)).size;
    $('counts').textContent=playlists.length+' çalma listesi · '+liked.length+' beğenilen şarkı · '+records.length+' toplam şarkı kaydı · '+unique+' benzersiz şarkı';
    const ul=document.createElement('ul');
    for(const p of details){const li=document.createElement('li');li.textContent=p.name+' — '+p.tracks.length+' şarkı'+(p.error?' (okunamadı: '+p.error+')':'');ul.appendChild(li);}
    $('lists').replaceChildren(ul);
    $('json').disabled=false;$('csv').disabled=false;
    status('Tarama tamamlandı. Hatalı listeler varsa ayrıntıları JSON dosyasında yer alır. JSON veya CSV dosyasını indirip birlikte inceleyebiliriz. Spotify üzerinde hiçbir değişiklik yapılmadı.');
  }catch(e){status('Tarama durdu: '+e.message+'\nBu işlem Spotify üzerinde hiçbir değişiklik yapmadı.');}
  finally{$('scan').disabled=false;}
}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvCell(v){const s=String(v??'');return '"'+s.replace(/"/g,'""')+'"';}
function exportCsv(){if(!archive)return;const keys=['source','playlist_name','id','name','artists','album','duration_ms','added_at','spotify_url'];const lines=[keys.join(','),...archive.all_track_entries.map(t=>keys.map(k=>csvCell(t[k])).join(','))];download('spotify-song-inventory.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');}
$('login').addEventListener('click',()=>authorize().catch(e=>status('Giriş başlatılamadı: '+e.message)));
$('scan').addEventListener('click',scan);
$('json').addEventListener('click',()=>{if(archive)download('spotify-library.json',JSON.stringify(archive,null,2),'application/json');});
$('csv').addEventListener('click',exportCsv);
$('logout').addEventListener('click',()=>{token=null;archive=null;clearPending();$('results').hidden=true;$('loginBox').hidden=false;status('Oturum kapatıldı.');});
$('cid').value=pending('cid')||'';
finishLogin().catch(e=>status('Giriş hatası: '+e.message));
</script>
</body>
</html>
